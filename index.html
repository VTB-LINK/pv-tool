<!doctype html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/metabox4.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PV Tool - Kinetic Typography Engine</title>
    <meta name="description" content="Browser-based kinetic typography & post-processing for PV / music videos" />
    <meta name="generator" content="solaris-0914">
    <link rel="alternate" hreflang="zh" href="https://pv.pixjam.cn/" />
    <link rel="alternate" hreflang="ja" href="https://pv.pixjam.cn/ja/" />
    <link rel="alternate" hreflang="en" href="https://pv.pixjam.cn/en/" />
    <link rel="alternate" hreflang="x-default" href="https://pv.pixjam.cn/en/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700;900&display=swap"
        rel="stylesheet">
    <script>
        // Set html lang based on URL path, then browser language
        var p = window.location.pathname;
        var n = (navigator.language || '').toLowerCase();
        if (p.includes('/ja')) {
            document.documentElement.lang = 'ja';
        } else if (p.includes('/en')) {
            document.documentElement.lang = 'en';
        } else if (p.includes('/zh')) {
            document.documentElement.lang = 'zh';
        } else if (n.startsWith('ja')) {
            document.documentElement.lang = 'ja';
        } else if (n.startsWith('en')) {
            document.documentElement.lang = 'en';
        } else {
            document.documentElement.lang = 'zh';
        }
    </script>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
